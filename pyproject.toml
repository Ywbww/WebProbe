[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "webprobe"
version = "2.0.0"
description = "WebProbe — small, legible web vulnerability scanner for student auditing."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "colorama>=0.4.6",
]

[project.optional-dependencies]
testbed = ["Flask>=3.0"]

[project.scripts]
webprobe = "webprobe.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["webprobe*"]

[tool.setuptools.package-data]
"webprobe.data" = ["**/*.txt"]
